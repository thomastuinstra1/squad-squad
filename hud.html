<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=x, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="hud">
      <div id="lives">
        <img src="../Images/hartje.png" alt="Leven 1" data-state="full" />
        <img src="../Images/hartje.png" alt="Leven 2" data-state="full" />
        <img src="../Images/hartje.png" alt="Leven 3" data-state="full" />
      </div>

      <button id="loseLifeBtn">Geef op</button>
    </div>
    <div id="popupOverlay" class="hidden">
      <div id="popupBox">
        <div id="uitlegText"></div>
        <div class="button-row">
          <button id="nextButton">Volgende</button>
        </div>
      </div>
    </div>

    <audio loop autoplay>
    <source src="../Muziek/neon-gaming-128925.mp3" type="audio/mpeg">
    
    <style>
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: calc(100vh - 40px);
        z-index: 99999;
        pointer-events: none;
      }

      #lives {
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }

      #lives img {
        width: 50px;
        height: auto;
      }

      #loseLifeBtn {
        align-self: flex-start;
        margin-bottom: 10px;
        padding: 10px 18px;
        background-color: #d33;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s ease, transform 0.1s ease;
        pointer-events: auto;
      }

      #loseLifeBtn:hover {
        background-color: #ff5555;
        transform: scale(1.05);
      }

      #loseLifeBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </body>
</html>
