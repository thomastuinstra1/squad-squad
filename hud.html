<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=x, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="hud">
        <div id="lives">
            <img src="../Images/hartje.png" alt="Leven 1" data-state="full" />
            <img src="../Images/hartje.png" alt="Leven 2" data-state="full" />
            <img src="../Images/hartje.png" alt="Leven 3" data-state="full" />
        </div>
  <button id="loseLifeBtn">Geef op</button>
</div>

<style>
  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 10px;
    z-index: 9999;
    align-items: center;
  }

  #lives img {
    width: 60px;
    height: auto;
  }

  #loseLifeBtn {
    padding: 8px 16px;
    background-color: #d33;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: background-color 0.3s ease, transform 0.1s ease;
  }

  #loseLifeBtn:hover {
    background-color: #ff5555;
    transform: scale(1.05);
  }

  #loseLifeBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</body>
</html>
