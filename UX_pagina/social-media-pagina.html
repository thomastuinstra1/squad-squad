<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Social Media</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
        /* ====== Mini Social Media: unieke stijlen ====== */
        .social-page {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }

        .social-header {
            background-color: #4267B2;
            color: white;
            padding: 16px 32px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .social-main {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            gap: 20px;
        }

        .social-sidebar {
            flex: 1;
            background-color: #fff;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .social-sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .social-sidebar ul {
            list-style: none;
            padding: 0;
        }
        .social-sidebar ul li {
            margin: 10px 0;
            cursor: pointer;
            color: #4267B2;
        }
        .social-sidebar ul li:hover {
            text-decoration: underline;
        }

        .social-feed {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .social-new-post {
            background-color: #fff;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .social-new-post textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            resize: none;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .social-new-post button {
            margin-top: 8px;
            padding: 10px 16px;
            background-color: #4267B2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .social-new-post button:hover {
            background-color: #365899;
        }

        .social-post {
            background-color: #fff;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .social-post h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #4267B2;
        }
        .social-post p {
            margin: 0;
        }
    </style>
</head>
<body class="social-page">
    <div id="hud-container"></div>
    <header class="social-header">
        Mini Social Media
    </header>
    <div class="social-main">
        <div class="social-sidebar">
            <h2>Snelkoppelingen</h2>
            <ul>
                <li>Home</li>
                <li>Profiel</li>
                <li>Berichten</li>
                <li>Notificaties</li>
                <li>Instellingen</li>
            </ul>
        </div>
        <div class="social-feed">
            <div class="social-new-post">
                <textarea placeholder="Wat wil je delen?"></textarea>
                <button>Post</button>
            </div>
            <div class="social-post">
                <h3>Alice</h3>
                <p>Vandaag lekker gewandeld in het park!</p>
            </div>
            <div class="social-post">
                <h3>Bob</h3>
                <p>Nieuwe social media pagina gebouwd met HTML en CSS!</p>
            </div>
            <div class="social-post">
                <h3>Charlie</h3>
                <p>Heeft iemand tips voor een goede boekentip?</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../Levens_script.js"></script>
</body>
</html>
