<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Slechte UX/UI elementen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <audio loop autoplay>
    <source src="../Muziek/neon-gaming-128925.mp3" type="audio/mpeg">
</audio>

    <div id="leaderboard">
      <h2>Leaderboard</h2>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
