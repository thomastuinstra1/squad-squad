<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fix-it | Game over</title>
    <link rel="stylesheet" href="VE_pagina.css" />
  </head>
  <body>
    <div class="container">
      <h1>Game over!</h1>
      <p>
        Goed geprobeerd! Wil je het opnieuw proberen klik dan op de knop
        hieronder.
      </p>
      <button id="retryBtn" class="btn">Opnieuw proberen</button>
    </div>
      <div id="pointsDisplay">
       Points: <span id="pointsCount">0</span>
      </div>
    <script src="../Levens_script.js" defer></script>
  </body>
  <style>
  #pointsDisplay {
    position: fixed;     
    top: 20px;            
    right: 20px;         
    background: rgba(197, 2, 2, 0.7);  
    color: #fff;          
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    z-index: 1000;        
    display: flex;
    align-items: center;
    gap: 5px;
      }
  </style>
</html>
